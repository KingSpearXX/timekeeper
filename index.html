<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="Employee time tracking and management system" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TimeKeeper" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/android-chrome-512x512.png" />
    
    <title>TimeKeeper</title>
    
    <!-- Initial Preloader Styles -->
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      .loader-logo {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 2rem;
        text-align: center;
      }
      
      .loader-spinner {
        width: 60px;
        height: 60px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: loader-spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      
      .loader-text {
        font-size: 1rem;
        opacity: 0.9;
        margin-bottom: 0.5rem;
      }
      
      .loader-subtext {
        font-size: 0.875rem;
        opacity: 0.7;
      }
      
      @keyframes loader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loader when Vue app loads */
      .app-loaded #initial-loader {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
    </style>
  </head>
  <body>
    <!-- Initial HTML Preloader -->
    <div id="initial-loader">
      <div class="loader-logo">TimeKeeper</div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading application...</div>
      <div class="loader-subtext">Please wait while we prepare your workspace</div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
